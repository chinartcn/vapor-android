[workspace]
resolver = "2"
members = [
    "crates/vapor-abi",
    "crates/vapor-core",
    "crates/vapor-renderer",
    "crates/vapor-packager",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Vapor Project"]

[workspace.dependencies]
log = "0.4"
android_logger = "0.14"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
