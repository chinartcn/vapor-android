[package]
name = "vapor-reactive"
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Vapor reactive core: alien-signals style fine-grained reactivity + fast 2D rasterizer (PyO3)"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
