name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 1) 纯 Python 回退层：不需要编译 Rust，快速验证 core/template/ui 逻辑
  # ---------------------------------------------------------------------------
  fallback:
    name: fallback (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - name: 纯 Python 测试（Vapor._core/_ui 走回退实现）
        env:
          PYTHONPATH: python
        run: python -m pytest python/tests/test_vapor_core.py python/tests/test_vapor_ui.py python/tests/test_vapor_touch.py python/tests/test_vapor_font.py python/tests/test_vapor_component.py python/tests/test_vapor_presets.py python/tests/test_vapor_sdk.py -q

  # ---------------------------------------------------------------------------
  # 2) 原生扩展：三个 maturin crate 分别构建 wheel，安装后跑同一套测试
  # ---------------------------------------------------------------------------
  native:
    name: native (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest

      - name: build vapor-reactive (Vapor._core)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/vapor-reactive
          command: build
          args: --release --out dist
          manylinux: auto
      - name: build vapor-ui (Vapor._ui)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/vapor-ui
          command: build
          args: --release --out dist
          manylinux: auto
      - name: build vapor-sdk (Vapor._sdk)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/vapor-sdk
          command: build
          args: --release --out dist
          manylinux: auto

      - name: 安装三个 wheel
        shell: bash
        run: |
          python -m pip install --no-deps \
            rust/vapor-reactive/dist/*.whl \
            rust/vapor-ui/dist/*.whl \
            rust/vapor-sdk/dist/*.whl

      - name: 诊断 wheel 内容
        shell: bash
        run: |
          python -m zipfile -l rust/vapor-reactive/dist/*.whl | head -25
          python -c "import Vapor; print('file=', Vapor.__file__); print('path=', getattr(Vapor, '__path__', None)); print('attrs=', sorted(n for n in dir(Vapor) if not n.startswith('_')))"
          python -m pip show -f vapor-reactive 2>/dev/null | head -30 || true

      - name: 确认用的是 Rust 实现
        run: python -c "import Vapor; s=Vapor.status(); print(s); assert s['core']=='rust' and s['ui']=='rust', s"

      - name: 原生测试
        env:
          VAPOR_STRICT_NATIVE: "1"
        run: python -m pytest python/tests/test_vapor_core.py python/tests/test_vapor_ui.py python/tests/test_vapor_touch.py python/tests/test_vapor_font.py python/tests/test_vapor_component.py python/tests/test_vapor_presets.py python/tests/test_vapor_sdk.py -q

      - name: 无头渲染冒烟（12 帧）
        env:
          VAPOR_STRICT_NATIVE: "1"
          VAPOR_DEMO_FRAMES: "12"
        run: python python/examples/counter.py

  # ---------------------------------------------------------------------------
  # 3) Android 交叉编译：aarch64 / armv7 的 PyO3 扩展（产物给 build_all.sh 用）
  # ---------------------------------------------------------------------------
  android-pyext:
    name: android pyext (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true
      - run: cargo install cargo-ndk --locked
      - name: 交叉编译三个 PyO3 crate（abi3，无需目标解释器）
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          VAPOR_ANDROID_API: "24"
        run: ./scripts/build_android_pyext.sh
      - name: 产物检查
        run: |
          find build/pyext -name '*.so' -exec file {} \;
          test -f build/pyext/arm64-v8a/Vapor/_core.so
          test -f build/pyext/armeabi-v7a/Vapor/_core.so
      - uses: actions/upload-artifact@v4
        with:
          name: vapor-pyext-android
          path: build/pyext/**/Vapor/*.so
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4) release 时构建全平台 wheel 并作为产物（tag 推送）
  # ---------------------------------------------------------------------------
  wheels:
    name: wheels (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-manylinux }
          - { os: ubuntu-latest, target: aarch64-manylinux }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64-windows }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build vapor-reactive
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/vapor-reactive
          command: build
          args: --release --out dist --strip
          target: ${{ matrix.target }}
          manylinux: auto
      - name: build vapor-ui
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/vapor-ui
          command: build
          args: --release --out dist --strip
          target: ${{ matrix.target }}
          manylinux: auto
      - name: build vapor-sdk
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/vapor-sdk
          command: build
          args: --release --out dist --strip
          target: ${{ matrix.target }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: |
            rust/vapor-reactive/dist/*.whl
            rust/vapor-ui/dist/*.whl
            rust/vapor-sdk/dist/*.whl
