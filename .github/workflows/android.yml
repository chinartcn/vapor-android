name: android

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "同时组装两个 APK（需要 Android SDK，耗时较长）"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyext:
    name: PyO3 extensions (arm64-v8a / armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true
      - run: cargo install cargo-ndk --locked
      - env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build_android_pyext.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vapor-pyext-android
          path: build/pyext/**/Vapor/*.so
          if-no-files-found: error

  apk:
    name: APK (manual)
    if: inputs.build_apk
    needs: pyext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android SDK 组件
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CMD="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          echo "SDK=$SDK CMD=$CMD"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$CMD" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$CMD/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$CMD/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true
      - run: cargo install cargo-ndk --locked
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: actions/download-artifact@v4
        with:
          name: vapor-pyext-android
          path: build/pyext
      - name: 构建 CPython 3.15.2 双架构
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build_cpython.sh all
      - name: 一键构建 APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build_all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vapor-apks
          path: build/output/*.apk
          if-no-files-found: warn
