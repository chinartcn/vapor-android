name: android

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "同时组装两个 APK（需要 Android SDK，耗时较长）"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyext:
    name: PyO3 extensions (arm64-v8a / armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true
      - name: Cache Cargo（registry + cargo-ndk）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/**/Cargo.toml', 'rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Cache PyO3 构建产物
        uses: actions/cache@v4
        with:
          path: build/target-pyext
          key: pyext-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust/**/Cargo.lock', 'rust/**/Cargo.toml', 'rust/**/*.rs', 'rust/*.rs') }}
          restore-keys: |
            pyext-${{ runner.os }}-
      - name: 安装 cargo-ndk（有缓存则跳过）
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
      - env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build_android_pyext.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vapor-pyext-android
          path: build/pyext/**/Vapor/*.so
          if-no-files-found: error

  apk:
    name: APK (manual)
    if: inputs.build_apk
    needs: pyext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android SDK 组件
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CMD="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          echo "SDK=$SDK CMD=$CMD"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$CMD" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$CMD/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$CMD/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Cache CPython / host-python / libffi
        uses: actions/cache@v4
        with:
          path: |
            build/cpython
            build/host-python
            build/libffi
            build/downloads
          key: cpython-3.15.2-${{ runner.os }}-${{ hashFiles('scripts/build_cpython.sh', 'scripts/check_cpython_version.py') }}
          restore-keys: |
            cpython-3.15.2-${{ runner.os }}-
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true
      - name: Cache Cargo（registry + cargo-ndk）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/**/Cargo.toml', 'rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Cache PyO3 构建产物
        uses: actions/cache@v4
        with:
          path: build/target-pyext
          key: pyext-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust/**/Cargo.lock', 'rust/**/Cargo.toml', 'rust/**/*.rs', 'rust/*.rs') }}
          restore-keys: |
            pyext-${{ runner.os }}-
      - name: 安装 cargo-ndk（有缓存则跳过）
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: actions/download-artifact@v4
        with:
          name: vapor-pyext-android
          path: build/pyext
      - name: 构建 CPython 3.15.2 双架构
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          VAPOR_OFFLINE: "1"
        run: ./scripts/build_cpython.sh all
      - name: 一键构建 APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          VAPOR_OFFLINE: "1"
        run: ./scripts/build_all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vapor-apks
          path: build/output/*.apk
          if-no-files-found: warn
